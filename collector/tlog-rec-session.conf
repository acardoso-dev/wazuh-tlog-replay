// /etc/tlog/tlog-rec-session.conf
// A entrada do usuário fica desligada: ela pode conter senhas.
{
    "writer": "file",
    "file": { "path": "/var/log/tlog/tlog.log" },
    "log": { "input": false, "output": true, "window": true },
    // Limita a gravação a cerca de 16 KiB/s por sessão. "delay" deixa o terminal mais lento nos
    // picos e não perde dados; "drop" descartaria trechos, o que ajudaria a esconder atividade.
    "limit": { "rate": 16384, "burst": 32768, "action": "delay" }
}
