// /etc/tlog/tlog-rec-session.conf
// User input is off because it can contain passwords.
{
    "writer": "file",
    "file": { "path": "/var/log/tlog/tlog.log" },
    "log": { "input": false, "output": true, "window": true },
    // Limits recording to about 16 KiB/s per session. "delay" slows the terminal down during
    // peaks and loses no data. "drop" would discard parts, which would help hide activity.
    "limit": { "rate": 16384, "burst": 32768, "action": "delay" }
}
