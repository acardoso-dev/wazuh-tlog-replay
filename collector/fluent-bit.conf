# Envia as gravações ao índice tlog-AAAA.MM.DD do Wazuh Indexer.
# Variáveis esperadas: WAZUH_INDEXER_HOST, TLOG_WRITER_USER, TLOG_WRITER_PASSWORD.
[SERVICE]
    Flush            5
    Parsers_File     parsers.conf
    storage.path     /var/lib/fluent-bit/storage

[INPUT]
    Name             tail
    Tag              tlog
    Path             /var/log/tlog/tlog.log
    Parser           json
    DB               /var/lib/fluent-bit/tlog.db
    Read_from_Head   On
    Buffer_Max_Size  256k
    # Sem isto, uma única linha maior que o buffer faz o Fluent Bit parar de ler o arquivo inteiro.
    Skip_Long_Lines  On
    storage.type     filesystem

[OUTPUT]
    Name               opensearch
    Match              tlog
    Host               ${WAZUH_INDEXER_HOST}
    Port               9200
    HTTP_User          ${TLOG_WRITER_USER}
    HTTP_Passwd        ${TLOG_WRITER_PASSWORD}
    tls                On
    tls.verify         On
    tls.ca_file        /etc/fluent-bit/root-ca.pem
    Logstash_Format    On
    Logstash_Prefix    tlog
    Suppress_Type_Name On
    # O id derivado do conteúdo evita duplicatas quando há reenvio.
    Generate_ID        On
    Retry_Limit        False
    # Com o indexador fora do ar, os dados mais antigos do buffer são descartados neste limite.
    storage.total_limit_size 500M
