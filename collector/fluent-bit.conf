# Sends the recordings to the tlog-YYYY.MM.DD index on the Wazuh indexer.
# Expected variables: WAZUH_INDEXER_HOST, TLOG_WRITER_USER, TLOG_WRITER_PASSWORD.
[SERVICE]
    Flush            5
    Parsers_File     parsers.conf
    storage.path     /var/lib/fluent-bit/storage

[INPUT]
    Name             tail
    Tag              tlog
    Path             /var/log/tlog/tlog.log
    Parser           json
    DB               /var/lib/fluent-bit/tlog.db
    Read_from_Head   On
    Buffer_Max_Size  256k
    # Without this, a single line larger than the buffer makes Fluent Bit stop reading the whole file.
    Skip_Long_Lines  On
    storage.type     filesystem

[OUTPUT]
    Name               opensearch
    Match              tlog
    Host               ${WAZUH_INDEXER_HOST}
    Port               9200
    HTTP_User          ${TLOG_WRITER_USER}
    HTTP_Passwd        ${TLOG_WRITER_PASSWORD}
    tls                On
    tls.verify         On
    tls.ca_file        /etc/fluent-bit/root-ca.pem
    Logstash_Format    On
    Logstash_Prefix    tlog
    Suppress_Type_Name On
    # An id derived from the content avoids duplicates when data is sent again.
    Generate_ID        On
    Retry_Limit        False
    # While the indexer is down, the oldest buffered data is discarded at this limit.
    storage.total_limit_size 500M
