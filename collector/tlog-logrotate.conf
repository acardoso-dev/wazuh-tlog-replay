# /etc/tlog/logrotate.conf
# Kept out of /etc/logrotate.d because it runs on its own timer, every 5 minutes.
/var/log/tlog/tlog.log {
    su _tlog _tlog
    hourly
    maxsize 100M
    rotate 3
    compress
    # Open sessions keep the file open. Renaming it would make them write to the old file,
    # which Fluent Bit stops following.
    copytruncate
    missingok
    notifempty
}
