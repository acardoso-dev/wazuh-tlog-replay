# /etc/tlog/logrotate.conf
# Fica fora de /etc/logrotate.d porque roda no próprio timer, a cada 5 minutos.
/var/log/tlog/tlog.log {
    su _tlog _tlog
    hourly
    maxsize 100M
    rotate 3
    compress
    # Sessões abertas mantêm o arquivo aberto. Renomear faria elas gravarem no arquivo antigo,
    # que o Fluent Bit deixa de acompanhar.
    copytruncate
    missingok
    notifempty
}
